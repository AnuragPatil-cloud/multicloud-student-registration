{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: student-registration
  namespace: {{ .Values.namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service: {name: student-registration-backend, port: {number: 8080}}
          - path: /
            pathType: Prefix
            backend:
              service: {name: student-registration-frontend, port: {number: 80}}
{{- end }}
