apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-registration-backend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels: {app: student-registration-backend}
  template:
    metadata:
      labels: {app: student-registration-backend}
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports: [{containerPort: 8080}]
          envFrom:
            - secretRef: {name: {{ .Values.backend.dbSecretName }}}
          readinessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health, port: 8080}
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
---
apiVersion: v1
kind: Service
metadata:
  name: student-registration-backend
  namespace: {{ .Values.namespace }}
spec:
  selector: {app: student-registration-backend}
  ports:
    - port: 8080
      targetPort: 8080
